[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbm-core"
version = "0.1.0"
description = "Shared definitions for the cbm experiments: data paths, events.csv, behavioral epochs, arena geometry, place fields, phy units."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the recordings under paths.DATA_ROOT (skipped if they are missing)"]
